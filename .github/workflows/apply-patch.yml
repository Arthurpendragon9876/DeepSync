name: Apply patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: Patch file path in the repo
        default: novel-reader-bar-size-and-press-feedback.patch
      strip:
        description: Path strip level (auto tries -p1 then -p2)
        type: choice
        options:
          - auto
          - "1"
          - "2"
        default: auto

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect strip level and check patch
        id: detect
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
          STRIP: ${{ inputs.strip }}
        run: |
          if [ "$STRIP" = "auto" ]; then
            levels="1 2"
          else
            levels="$STRIP"
          fi
          for p in $levels; do
            echo "Trying -p$p"
            if git apply --check -p"$p" "$PATCH_FILE"; then
              echo "level=$p" >> "$GITHUB_OUTPUT"
              echo "Patch applies cleanly with -p$p"
              exit 0
            fi
          done
          echo "::error::Patch does not apply with strip level(s): $levels"
          exit 1

      - name: Apply patch
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
          LEVEL: ${{ steps.detect.outputs.level }}
        run: |
          git apply -p"$LEVEL" --whitespace=nowarn "$PATCH_FILE"
          rm -f "$PATCH_FILE"

      - name: Commit and push to main
        env:
          PATCH_FILE: ${{ inputs.patch_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply $PATCH_FILE"
          git push origin HEAD:${{ github.ref_name }}
