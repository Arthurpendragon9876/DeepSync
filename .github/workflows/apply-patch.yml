name: Apply patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: Patch file path in the repo
        default: novel-reader-bar-size-and-press-feedback.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check patch applies
        run: git apply --check -p2 "${{ inputs.patch_file }}"

      - name: Apply patch
        run: |
          git apply -p2 --whitespace=nowarn "${{ inputs.patch_file }}"
          rm -f "${{ inputs.patch_file }}"

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply ${{ inputs.patch_file }}"
          git push origin HEAD:${{ github.ref_name }}
