name: Android preview build

# Builds a standalone "preview" APK on manual dispatch.
# The preview variant is a non-debuggable build with none of the debug-only tooling
# (no LeakCanary/StrictMode/debug settings/ACRA-debug) and its own applicationId suffix, so it
# installs alongside the store build. R8/resource shrinking is intentionally OFF so the APK
# installs cleanly when sideloaded. It is signed with the same permanent keystore as the release build
# (the KEYSTORE_BASE64 / RELEASE_* repository secrets), so a new preview installs over the old one without
# reinstalling. Without those secrets it falls back to the debug key and says so in the run summary.
#
# The APK is published as a workflow artifact (zipped by GitHub) for anyone who prefers the Actions tab.
# The SHA-256/SHA-1/MD5 hashes are printed to the run summary.
on:
  workflow_dispatch:
  # Remove this push block once the branch experiment is merged and tested.
  push:
    branches: [desktop]
    paths: ['android/**', '.github/workflows/android-preview.yml']

permissions:
  contents: read

# Only keep the latest preview build per branch/ref running.
concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build preview APK
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed_with=release keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not found: this preview is signed with the debug key and will not install over a preview signed with your own key."
            echo "signed_with=debug key (no KEYSTORE_BASE64 secret)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build preview APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            ./gradlew :app:assemblePreview --no-daemon --stacktrace \
              -PRELEASE_STORE_FILE=../release.keystore \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            ./gradlew :app:assemblePreview --no-daemon --stacktrace
          fi

      - name: Collect APK and compute checksums
        id: apk
        env:
          SIGNED_WITH: ${{ steps.signing.outputs.signed_with }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No preview APK found under app/build/outputs/apk/preview"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          DEST="Yugen-preview-${SAFE_REF}-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SHA1=$(sha1sum "$DEST" | awk '{print $1}')
          MD5=$(md5sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)

          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"

          # Write release details to the run summary.
          {
            echo "**Preview build of \`${GITHUB_REF_NAME}\`** — non-debuggable, no dev tooling, installs"
            echo "as a separate app (\`com.kotatsu.deepsync.preview\`, \"DeepSync Preview\")."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${DEST}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Size | ${SIZE} |"
            echo "| Signed with | ${SIGNED_WITH} |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo "| SHA-1 | \`${SHA1}\` |"
            echo "| MD5 | \`${MD5}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: android/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
