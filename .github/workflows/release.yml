name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New version name (e.g. 1.2.3) — release tag will be created as v<version>'
        required: true
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional: test the future runtime now
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Validate version_name input
      run: |
        VERSION_NAME="${{ inputs.version_name }}"

        # Reject branch-like names that must never be used as tags
        RESERVED_NAMES="main master develop dev release"
        for reserved in $RESERVED_NAMES; do
          if [ "$VERSION_NAME" = "$reserved" ]; then
            echo "::error::version_name '${VERSION_NAME}' is a reserved branch name and cannot be used as a version/tag."
            exit 1
          fi
        done

        # Require the version to match a semver-like pattern (no leading 'v'; release tag will be v<version>)
        if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
          echo "::error::version_name '${VERSION_NAME}' is invalid. Use a semver-like format such as '1.2.3' or '1.2.3-beta.1'. The release tag will be created as v${VERSION_NAME}."
          exit 1
        fi

        echo "version_name '${VERSION_NAME}' is valid. Release tag will be: v${VERSION_NAME}"

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        else
          echo "No keystore secret found, creating debug keystore"
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
        fi

    - name: Update versionName and increment versionCode
      run: |
        VERSION_NAME="${{ inputs.version_name }}"
        BUILD_GRADLE="app/build.gradle"

        sed -i -E "s/(versionName = ')[^']*(')/\1${VERSION_NAME}\2/" "$BUILD_GRADLE"
        CURRENT_CODE=$(grep -E "versionCode = [0-9]+" "$BUILD_GRADLE" | head -n1 | sed -E "s/.*= ([0-9]+)/\1/")
        NEXT_CODE=$((CURRENT_CODE + 1))
        sed -i -E "s/versionCode = [0-9]+/versionCode = ${NEXT_CODE}/" "$BUILD_GRADLE"

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --no-daemon --stacktrace \
          -PRELEASE_STORE_FILE=../release.keystore \
          -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD || 'password' }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS || 'release' }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD || 'password' }}"

    - name: Commit version updates
      id: version_commit
      run: |
        BRANCH_NAME="${{ github.ref_name }}"

        if git diff --quiet -- app/build.gradle; then
          echo "No version changes to commit"
          echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "chore(release): set versionName ${{ inputs.version_name }} and bump versionCode"

        # Use refs/heads/ explicitly to avoid ambiguity with any tag that shares the branch name
        for attempt in 1 2 3; do
          if git push origin "HEAD:refs/heads/$BRANCH_NAME"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Failed to push version commit after 3 attempts"
            exit 1
          fi
          git pull --rebase origin "refs/heads/$BRANCH_NAME"
          sleep 2
        done

        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Prepare changelog from repo files
      id: changelog
      env:
        VERSION_NAME: ${{ inputs.version_name }}
        COMMIT_SHA: ${{ steps.version_commit.outputs.commit_sha }}
      run: |
        set -euo pipefail
        OUT="release_changelog.md"
        : > "$OUT"

        # 1) changelogs/v<version>.md: a hand-written file for exactly this release.
        #    Its own title line ("## Yugen v...") is dropped; the release page already has a title.
        PER_RELEASE="changelogs/v${VERSION_NAME}.md"
        if [ -f "$PER_RELEASE" ]; then
          echo "Using $PER_RELEASE"
          sed '1{/^## /d}' "$PER_RELEASE" > "$OUT"
        fi

        # 2) The "## [<version>]" section of CHANGELOG.md.
        if [ ! -s "$OUT" ] && [ -f CHANGELOG.md ]; then
          awk -v v="[${VERSION_NAME}]" '
            /^## / { if (found) exit; if (index($0, v) > 0) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$OUT"
          if [ -s "$OUT" ]; then echo "Using the [${VERSION_NAME}] section of CHANGELOG.md"; fi
        fi

        # 3) Last resort: git log since the previous release tag.
        if [ ! -s "$OUT" ]; then
          echo "::warning::No changelog file found for ${VERSION_NAME} (looked for ${PER_RELEASE} and a '## [${VERSION_NAME}]' section in CHANGELOG.md). Falling back to git log."
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$COMMIT_SHA" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..$COMMIT_SHA"; else RANGE="$COMMIT_SHA"; fi
          git log --pretty=format:"- %s" --no-merges -n 50 --invert-grep --grep='^chore(release): set versionName ' $RANGE > "$OUT" || true
          if [ ! -s "$OUT" ]; then echo "- No changes since ${PREVIOUS_TAG:-the last release}" > "$OUT"; fi
        fi

        echo "--- release changelog ---"
        cat "$OUT"

    - name: Collect Release APKs
      run: |
        mkdir -p release
        shopt -s nullglob
        APK_FILES=(app/build/outputs/apk/release/*.apk)
        if [ ${#APK_FILES[@]} -eq 0 ]; then
          echo "Error: No APK file found"
          exit 1
        fi

        for apk in "${APK_FILES[@]}"; do
          if [ ${#APK_FILES[@]} -eq 1 ]; then
            target="release/Yugen-v${{ inputs.version_name }}.apk"
          else
            original_apk_name=$(basename "$apk" .apk)
            target="release/Yugen-v${{ inputs.version_name }}-${original_apk_name}.apk"
          fi
          cp "$apk" "$target"
        done

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_NAME: ${{ inputs.version_name }}
        TARGET_SHA: ${{ steps.version_commit.outputs.commit_sha }}
      run: |
        TAG="v${VERSION_NAME}"
        NOTES_FILE="release_notes.md"

        {
          echo "### Changelog"
          echo
          cat release_changelog.md
          echo
          cat <<'EOF'
        ### Installation Instructions
        1. Download and install the Yugen apk file first
        2. Go to the Explore menu > Manage and click the pen icon to add an extension repo
        3. Install and use the extensions, read, add items to the favorites and ENJOY!

        If this is your first time using the app, I recommend uninstalling any extension you find when opening the app for the first time and then installing latest extensions from your preferred repository.

        Yugen is the Android app of the DeepSync project. Shinkai (Linux) and Yomi (Windows) are coming soon.
        EOF
        } > "$NOTES_FILE"

        gh release create "$TAG" release/*.apk \
          --title "Yugen $TAG" \
          --target "$TARGET_SHA" \
          --notes-file "$NOTES_FILE"
