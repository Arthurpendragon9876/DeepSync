<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yomi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' deepsync: data: blob: https:; media-src 'self' deepsync: blob:; connect-src 'self' deepsync:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="assets/icon.png">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/yomi.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-center">
      <img class="sp-logo" src="assets/logo-mark.png" alt="">
      <div class="sp-word"><span class="c" style="--i:0">Y</span><span class="c" style="--i:1"><svg class="sp-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" pathLength="100"/></svg></span><span class="c" style="--i:2">M</span><span class="c" style="--i:3">I</span></div>
    </div>
    <div class="sp-skip">press any key to skip</div>
  </div>
  <div id="root">
    <div id="titlebar" class="hidden"></div>
    <div id="app">
      <nav id="sidebar" aria-label="Main"></nav>
      <main id="main"><div id="view"></div></main>
    </div>
  </div>
  <div id="overlay"></div>
  <!--SHIM-->
  <script type="module" src="js/app.js"></script>
</body>
</html>
