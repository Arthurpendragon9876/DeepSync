<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shinkai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' deepsync: data: blob: https:; media-src 'self' deepsync: blob:; connect-src 'self' deepsync:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="assets/icon.png">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/yugen.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-center">
      <img class="sp-logo" src="assets/logo-mark.png" alt="">
      <div class="sp-word"><span class="sp-type">SH<svg class="sp-torii" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 3.4Q6 .2 12 3.4L11.3 6.4Q6 4 .7 6.4Z"/><rect x="1.8" y="7.6" width="8.4" height="1.9"/><rect x="5.1" y="5" width="1.8" height="2.8"/><rect x="2.7" y="6" width="2.2" height="10"/><rect x="7.1" y="6" width="2.2" height="10"/></svg>NKAI</span><span class="sp-cur"></span></div>
    </div>
    <pre class="sp-log"><span class="l" style="--d:.15s"><span class="ok">[  OK  ]</span> Started Shinkai</span><span class="l" style="--d:.5s"><span class="ok">[  OK  ]</span> Mounted library folders</span><span class="l" style="--d:.85s"><span class="ok">[  OK  ]</span> Reached target Browse</span></pre>
    <div class="sp-skip">press any key to skip</div>
  </div>
  <div id="root">
    <div id="titlebar" class="hidden"></div>
    <div id="app">
      <nav id="sidebar" aria-label="Main"></nav>
      <main id="main"><div id="view"></div></main>
    </div>
  </div>
  <div id="overlay"></div>
  <!--SHIM-->
  <script type="module" src="js/app.js"></script>
</body>
</html>
