import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import java.util.zip.ZipFile


plugins {
	id 'com.android.application'
	id 'com.google.devtools.ksp'
	id 'org.jetbrains.kotlin.plugin.parcelize'
	id 'com.google.dagger.hilt.android'
	id 'androidx.room'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'org.jetbrains.kotlin.plugin.compose'
}

android {
	compileSdk {
		version = release(37) {
			minorApiLevel = 0
		}
	}
	namespace = 'org.koitharu.kotatsu'

	defaultConfig {
		applicationId = 'com.kotatsu.deepsync'
		minSdk = 26
		targetSdk = 37
		versionCode = 11
		versionName = '0.1.4'
		testInstrumentationRunner = 'org.koitharu.kotatsu.HiltTestRunner'
		ksp {
			arg('room.generateKotlin', 'true')
		}
		// Public identifier (the OAuth device flow needs no secret). Pass -PGITHUB_CLIENT_ID=... or set
		// the GITHUB_CLIENT_ID env var; empty hides GitHub sync.
		def githubClientId = project.findProperty('GITHUB_CLIENT_ID') ?: System.getenv('GITHUB_CLIENT_ID') ?: ''
		buildConfigField 'String', 'GITHUB_CLIENT_ID', '"' + githubClientId + '"'
		// Public identifier too (OAuth with PKCE needs no secret). Pass -PDROPBOX_APP_KEY=... or set the
		// DROPBOX_APP_KEY env var; empty hides Dropbox sync. Register the redirect URI db-<app key>://oauth.
		def dropboxAppKey = project.findProperty('DROPBOX_APP_KEY') ?: System.getenv('DROPBOX_APP_KEY') ?: ''
		buildConfigField 'String', 'DROPBOX_APP_KEY', '"' + dropboxAppKey + '"'
		// Microsoft Entra app (personal accounts, public client, no secret). Pass -PONEDRIVE_CLIENT_ID=... or set the
		// ONEDRIVE_CLIENT_ID env var; empty hides OneDrive sync. Register the redirect URI msal<client id>://auth.
		def oneDriveClientId = project.findProperty('ONEDRIVE_CLIENT_ID') ?: System.getenv('ONEDRIVE_CLIENT_ID') ?: ''
		buildConfigField 'String', 'ONEDRIVE_CLIENT_ID', '"' + oneDriveClientId + '"'
		manifestPlaceholders = [
				dropboxRedirectScheme : 'db-' + (dropboxAppKey ?: 'unconfigured'),
				onedriveRedirectScheme: 'msal' + (oneDriveClientId ?: 'unconfigured'),
		]
		androidResources {
			// https://issuetracker.google.com/issues/408030127
			generateLocaleConfig = false
		}
	}
	signingConfigs {
		if (project.hasProperty('RELEASE_STORE_FILE')) {
			release {
				storeFile file(project.property('RELEASE_STORE_FILE'))
				storePassword project.property('RELEASE_STORE_PASSWORD')
				keyAlias project.property('RELEASE_KEY_ALIAS')
				keyPassword project.property('RELEASE_KEY_PASSWORD')
			}
		}
	}
	buildTypes {
		debug {
			applicationIdSuffix = '.debug'
		}
		preview {
			applicationIdSuffix = '.preview'
			minifyEnabled = false
			debuggable = true
			signingConfig = signingConfigs.findByName('release') ?: signingConfigs.debug
		}
		release {
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			// Universal APK (every ABI in one file). Without a release keystore it is signed with the debug
			// key so assembleRelease output installs straight away.
			signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
		}
	}
	buildFeatures {
		viewBinding = true
		buildConfig = true
		compose = true
		aidl = true
	}
	packaging {
		resources {
			//noinspection GrDeprecatedAPIUsage
			exclude 'META-INF/README.md'
			//noinspection GrDeprecatedAPIUsage
			exclude 'META-INF/NOTICE.md'
		}
		jniLibs {
			// GitHub releases are universal APKs, so compress native libraries to avoid
			// shipping every ABI at its full on-disk size. Android extracts them at install.
			useLegacyPackaging = true
		}
	}
	sourceSets {
		preview.kotlin.srcDirs += 'src/release/kotlin'
		preview.res.srcDirs += 'src/release/res'
	}
	compileOptions {
		coreLibraryDesugaringEnabled = true
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	room {
		schemaDirectory "$projectDir/schemas"
	}
	lint {
		abortOnError = true
		warningsAsErrors = true
		disable 'MissingTranslation',
			'PrivateResource',
			'SetJavaScriptEnabled',
			'SimpleDateFormat',
			'UnusedResources',
			'Untranslatable',
			'UnusedAttribute',
			'LocalContextResourcesRead',
			'UseKtx',
			'Overdraw',
			'ContentDescription',
			'TypographyEllipsis',
			'UnusedTranslation',
			'InconsistentLayout',
			'NewerVersionAvailable',
			'GradleDependency',
			'HardcodedText',
			'PluralsCandidate',
			'Typos',
			'VectorPath',
			'BatteryLife',
			'VisibleForTests',
			'RtlSymmetry',
			'ObsoleteSdkInt',
			'IconXmlAndPng',
			'SmallSp',
			'ModifierParameter',
			'InflateParams',
			'CustomViewStyleable',
			'ClickableViewAccessibility',
			'SetTextI18n',
			'NotifyDataSetChanged',
			// Play SDK Index policy notes on play-services-auth.
			// Irrelevant for GitHub distribution; not published to the Play Store.
			'PlaySdkIndexNonCompliant'
	}
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_11
		freeCompilerArgs.addAll([
			'-opt-in=kotlin.ExperimentalStdlibApi',
			'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
			'-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
			'-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
			'-opt-in=kotlinx.coroutines.FlowPreview',
			'-opt-in=kotlin.contracts.ExperimentalContracts',
			'-opt-in=coil3.annotation.ExperimentalCoilApi',
			'-opt-in=coil3.annotation.InternalCoilApi',
			'-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
			// The Material 3 Expressive theme + motion scheme are referenced from every Compose
			// surface in the app (see DropSauceTheme), so opt in once here instead of per file.
			'-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi',
			'-opt-in=org.koitharu.kotatsu.parsers.InternalParsersApi',
			'-Xjspecify-annotations=strict'
		])
	}
}

// Cloudstream (.cs3) plugin support: the official library jar with the Android-only classes removed (Yugen
// ships its own implementations of those under com.lagradost.*), verified by hash.
def cloudstreamSourceJar = layout.projectDirectory.file('libs/cloudstream3-library-jvm-1.0.1.jar')
// Official library:jvmJar built from recloudstream/cloudstream commit caf0db3dc13bd75a496d4a94152bb8f22f8fdb1e.
def cloudstreamSourceSha256 = '0a281a34bc4335f024b9bf0ac55ba341d7ae99f5b8918c692c669d7d0bed600e'
def cloudstreamSanitizedJarTask = tasks.register('prepareCloudstreamRuntimeJar', Jar) {
	archiveBaseName.set('cloudstream3-runtime')
	archiveVersion.set('pre-release')
	destinationDirectory.set(layout.buildDirectory.dir('generated/cloudstream'))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	from({
		def sourceJar = cloudstreamSourceJar.asFile
		if (!sourceJar.exists()) {
			throw new GradleException("Missing Cloudstream source jar: ${sourceJar.absolutePath}")
		}
		zipTree(sourceJar)
	}) {
		// library:jvmJar contains a no-op JVM resolver. Kototoro supplies the Android implementation.
		exclude 'com/lagradost/cloudstream3/network/WebViewResolver*.class'
		// The JVM context helper always returns null. Kototoro supplies the Android implementation.
		exclude 'com/lagradost/api/ContextHelper_jvmKt.class'
	}

	doLast {
		[
			(cloudstreamSourceJar.asFile): cloudstreamSourceSha256,
		].each { inputJar, expectedSha256 ->
			def digest = java.security.MessageDigest.getInstance('SHA-256')
			inputJar.withInputStream { input ->
				byte[] buffer = new byte[8192]
				for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
					digest.update(buffer, 0, read)
				}
			}
			def actualSha256 = digest.digest().encodeHex().toString()
			if (actualSha256 != expectedSha256) {
				throw new GradleException(
					"Unexpected Cloudstream jar SHA-256 for ${inputJar.name}: ${actualSha256}; expected ${expectedSha256}",
				)
			}
		}

		def outputJar = archiveFile.get().asFile
		def forbiddenEntries = []
		ZipFile zipFile = new ZipFile(outputJar)
		try {
			zipFile.entries().each { entry ->
				if (
					entry.name.startsWith('coil3/') ||
					entry.name.startsWith('androidx/') ||
					entry.name.startsWith('kotlinx/coroutines/') ||
					entry.name.startsWith('com/google/android/material/') ||
					(
						(entry.name ==~ /.*\/R(\$[^\/]+)?\.class$/ || entry.name.endsWith('/BuildConfig.class')) &&
						!entry.name.startsWith('com/lagradost/cloudstream3/') &&
						!entry.name.startsWith('com/lagradost/api/')
					)
				) {
					forbiddenEntries << entry.name
				}
			}
		} finally {
			zipFile.close()
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException("Sanitized Cloudstream jar still contains forbidden entries: ${forbiddenEntries.take(5)}")
		}
		ZipFile verifiedZipFile = new ZipFile(outputJar)
		try {
			[
				'com/lagradost/cloudstream3/plugins/BasePlugin.class',
				'com/lagradost/cloudstream3/utils/ExtractorApi.class',
				'com/lagradost/cloudstream3/utils/JsInterpreterKt.class',
				// The official NewPipe-backed extractor; the host bundles NewPipeExtractor for it (#608).
				'com/lagradost/cloudstream3/extractors/YoutubeExtractor.class',
			].each { requiredEntry ->
				if (verifiedZipFile.getEntry(requiredEntry) == null) {
					throw new GradleException("Sanitized Cloudstream jar is missing ${requiredEntry}")
				}
			}
		} finally {
			verifiedZipFile.close()
		}
	}
}

def cloudstreamRuntimeJar = files(cloudstreamSanitizedJarTask.flatMap { it.archiveFile })


dependencies {
	coreLibraryDesugaring libs.desugar.jdk.libs
	implementation libs.kotlinx.coroutines.android
	implementation libs.kotlinx.coroutines.core
	implementation libs.kotlinx.coroutines.guava

	implementation libs.androidx.appcompat
	implementation libs.androidx.core
	implementation libs.androidx.activity
	implementation libs.androidx.fragment
	implementation libs.androidx.transition
	implementation libs.androidx.collection
	implementation libs.lifecycle.viewmodel
	implementation libs.lifecycle.service
	implementation libs.lifecycle.process
	implementation libs.androidx.constraintlayout
	implementation libs.androidx.documentfile
	implementation libs.androidx.swiperefreshlayout
	implementation libs.androidx.recyclerview
	implementation libs.androidx.viewpager2
	implementation libs.androidx.preference
	implementation libs.androidx.biometric
	implementation libs.material
	implementation libs.androidx.webkit

	implementation libs.androidx.work.runtime
	implementation libs.guava

    // Foldable/Window layout
    implementation libs.androidx.window

    // Jetpack Compose (used for the floating bottom navigation bar)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.activity
    implementation libs.androidx.graphics.shapes

	implementation libs.androidx.room.runtime
	implementation libs.androidx.room.ktx
	ksp libs.androidx.room.compiler

	implementation libs.play.services.auth

	implementation libs.okhttp
	implementation libs.okhttp.brotli
	implementation libs.okhttp.zstd
	implementation libs.okhttp.tls
	implementation libs.okhttp.dnsoverhttps
	implementation libs.okio
	// Cloudstream (.cs3) plugin runtime: the sanitized official library plus what it and the plugins link against.
	implementation cloudstreamRuntimeJar
	implementation files('libs/fuzzywuzzy-1.4.0.jar')
	implementation libs.gson
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2'
	implementation(libs.nicehttp) {
		exclude group: 'org.json', module: 'json'
	}
	implementation libs.rhino
	// Classes the Cloudstream library itself needs at start-up (ExtractorApi: hashing/AES, URL and date handling).
	implementation libs.cryptography.core
	implementation libs.cryptography.provider.optimal
	implementation libs.ktor.http
	implementation libs.kotlinx.datetime
	implementation libs.kotlinx.io.core
	implementation(libs.newpipe.extractor) {
		// The javax.script adapter: Android has no javax.script, and NewPipe calls Rhino directly.
		exclude group: 'org.mozilla', module: 'rhino-engine'
	}
	implementation libs.rxjava
	implementation libs.quickJs
	implementation libs.junrar
	implementation libs.unifile
	implementation libs.injekt.core
	// Extension APKs link against Mihon's Jsoup surface; keep it explicit and version-aligned
	// instead of accepting whichever transitive version the native parser happens to provide.
	implementation libs.jsoup
	implementation libs.kotlinx.serialization.json
	implementation libs.kotlinx.serialization.json.okio
	implementation libs.kotlinx.serialization.protobuf
	implementation libs.shizuku.api
	implementation libs.shizuku.provider
	// xmlutil — required by extensions that parse XML-based manga sites
	implementation libs.xmlutil.core
	implementation libs.xmlutil.serialization

	implementation libs.adapterdelegates
	implementation(libs.adapterdelegates.viewbinding) {
		exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
	}

	implementation libs.hilt.android
	ksp libs.hilt.compiler
	implementation libs.androidx.hilt.work
	ksp libs.androidx.hilt.compiler

	implementation libs.coil.core
	implementation libs.coil.compose
	implementation libs.coil.network
	implementation libs.coil.gif
	implementation libs.coil.svg
	implementation libs.avif.decoder
	implementation libs.ssiv
	implementation libs.disk.lru.cache
	implementation libs.markwon
	implementation libs.kizzyrpc

	implementation libs.acra.dialog


	testImplementation libs.junit
	testImplementation libs.kotlinx.coroutines.test

	androidTestImplementation libs.androidx.runner
	androidTestImplementation libs.androidx.junit

	androidTestImplementation libs.kotlinx.coroutines.test

	androidTestImplementation libs.moshi.kotlin

	androidTestImplementation libs.hilt.android.testing
	kspAndroidTest libs.hilt.android.compiler
	// Anime mode built-in player (media3 / ExoPlayer)
	implementation "androidx.media3:media3-exoplayer:1.7.1"
	implementation "androidx.media3:media3-exoplayer-hls:1.7.1"
	implementation "androidx.media3:media3-exoplayer-dash:1.7.1"
	implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.7.1"
	implementation "androidx.media3:media3-datasource-okhttp:1.7.1"
	implementation "androidx.media3:media3-ui:1.7.1"
	// FFmpeg software AUDIO decoders (AC3 / E-AC3 / DTS...) so multi-audio releases are not silent.
	implementation "io.github.anilbeesetti:nextlib-media3ext:1.7.1-0.9.0"
}
